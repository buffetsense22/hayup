<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

<title>Menu · BuffetSense</title>
</head>
<body data-page="menu">
<div class="app shell">
  <main class="page">
    <h1>Today’s buffet</h1>
    <input class="search" id="q" type="search" placeholder="Search dishes" aria-label="Search dishes" autocomplete="off" />
    <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
    <label class="check"><input type="checkbox" id="safe" /> Hide dishes with my allergens</label>
    <ul class="dish-list" id="list"></ul>
  </main>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
  const cats = ["All", "Favorites", ...new Set(DISHES.map((d) => d.c))];
  let cat = "All";
  $("#q").addEventListener("input", render);
  $("#safe").addEventListener("change", render);

  function row(d) {
    const li = el("li", "dish-row");
    const a = el("a", "dish-link"); a.href = "dish-details.html?id=" + d.id;
    const img = el("img"); img.src = d.img; img.alt = ""; img.loading = "lazy";
    const info = el("div", "dish-info"); info.append(el("strong", "", d.n));
    const c = conflicts(d);
    info.append(c.length ? el("span", "warn", "Contains " + c.join(", ")) : el("span", "", d.kcal + " kcal · " + d.c));
    a.append(img, info);
    const fav = favs().includes(d.id);
    const fb = iconBtn((fav ? "fas fa-heart fav-on" : "far fa-heart"), fav ? "Remove from favorites" : "Add to favorites", () => { toggleFav(d.id); render(); });
    const ab = iconBtn("fas fa-plus", "Add " + d.n + " to plate", () => { addToPlate(d.id); toast("Added to plate"); });
    li.append(a, fb, ab);
    return li;
  }

  function render() {
    $("#chips").replaceChildren(...cats.map((c) => {
      const b = el("button", "chip", c); b.type = "button"; b.setAttribute("aria-pressed", c === cat);
      b.onclick = () => { cat = c; render(); }; return b;
    }));
    const term = $("#q").value.trim().toLowerCase(), safe = $("#safe").checked, f = favs();
    const rows = DISHES.filter((d) =>
      (cat === "All" || (cat === "Favorites" ? f.includes(d.id) : d.c === cat)) &&
      d.n.toLowerCase().includes(term) && !(safe && conflicts(d).length));
    $("#list").replaceChildren(...(rows.length ? rows.map(row) : [el("li", "empty", "No dishes match.")]));
  }
  render();
</script>
</body>
</html>
