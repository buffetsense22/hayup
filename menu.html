<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<title>Scan dish · BuffetSense</title>
</head>
<body data-page="scan">
<div class="app shell">
  <main class="page">
    <section>
      <h1>Scan a dish</h1>
      <p>Point at a dish to see calories, allergens and ingredients.</p>
    </section>
    <div class="scanner">
      <img src="grilled-chicken.jpg" alt="Dish being scanned" />
      <div class="scan-line" aria-hidden="true"></div>
    </div>
    <a class="card result-card" href="dish-details.html">
      <img src="grilled-chicken.jpg" alt="" />
      <div class="grow"><strong>Grilled Chicken</strong><span>About 320 kcal</span></div>
      <i class="fas fa-chevron-right" aria-hidden="true"></i>
    </a>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
