<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

<title>Home · BuffetSense</title>
</head>
<body data-page="home">
<div class="app shell">
  <main class="page">
    <section><h1 id="hello">Welcome</h1><p>Your buffet at a glance.</p></section>

    <section class="card card-body" id="setup" hidden>
      <h2 style="font-size:var(--fs-lg)">Set your allergens</h2>
      <p>Get warnings on any dish that contains something you avoid.</p>
      <a class="btn btn-primary" href="profile.html">Set up profile</a>
    </section>

    <section class="tiles">
      <div class="tile"><span class="label">Dishes today</span><span class="value" id="tDishes"></span></div>
      <div class="tile"><span class="label">My favorites</span><span class="value" id="tFavs"></span></div>
      <div class="tile"><span class="label">Reviews</span><span class="value" id="tRevs"></span></div>
      <div class="tile"><span class="label">Avg rating</span><span class="value" id="tAvg"></span></div>
    </section>

    <section class="card card-body stack">
      <h2 style="font-size:var(--fs-lg);margin:0">My plate</h2>
      <p id="plateText" style="margin:0"></p>
      <div class="progress"><div class="progress-fill" id="plateBar"></div></div>
      <a class="btn btn-ghost" href="plate.html">Open plate</a>
    </section>

    <section class="quick">
      <a href="fmenu.html"><i class="fas fa-utensils"></i>Browse menu</a>
      <a href="menu.html"><i class="fas fa-qrcode"></i>Scan dish</a>
      <a href="feedback.html"><i class="fas fa-comment-medical"></i>Review</a>
    </section>
  </main>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
  const n = userName();
  $("#hello").textContent = n ? "Welcome back, " + n : "Welcome";
  $("#setup").hidden = !!S.get("profile", null);
  const revs = reviews();
  $("#tDishes").textContent = DISHES.length;
  $("#tFavs").textContent = favs().length;
  $("#tRevs").textContent = revs.length;
  $("#tAvg").textContent = revs.length ? avg(revs).toFixed(1) : "–";
  const kcal = plateKcal(), goal = profile().goal;
  $("#plateText").textContent = plateCount() ? `${kcal} of ${goal} kcal · ${plateCount()} item(s)` : "Nothing on your plate yet.";
  const bar = $("#plateBar");
  bar.style.width = Math.min(100, (kcal / goal) * 100) + "%";
  if (kcal > goal) bar.classList.add("over");
</script>
</body>
</html>
