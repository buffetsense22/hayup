<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<title>Home · BuffetSense</title>
</head>
<body data-page="home">
<div class="app shell">
  <main class="page">
    <section>
      <h1 id="hello">Welcome back</h1>
      <p>Here’s how the buffet is doing today.</p>
    </section>

    <section class="tiles" aria-label="Buffet overview">
      <div class="tile"><span class="label">Live dishes</span><span class="value">24</span></div>
      <div class="tile"><span class="label">Satisfaction</span><span class="value">4 / 5</span></div>
      <div class="tile"><span class="label">Meals served</span><span class="value">356</span></div>
      <div class="tile"><span class="label">Waste reduced</span><span class="value">12.3 kg</span></div>
      <div class="tile wide"><span class="label">Top dish</span><span class="value">Grilled Chicken</span></div>
    </section>

    <section class="card card-body">
      <h2 style="font-size:var(--fs-lg)">Notifications</h2>
      <ul class="notice-list">
        <li><i class="fas fa-triangle-exclamation"></i> Low stock: Leche Flan</li>
        <li><i class="fas fa-comment"></i> New feedback: “Loved the adobo!”</li>
      </ul>
    </section>

    <section class="quick" aria-label="Quick actions">
      <a href="fmenu.html"><i class="fas fa-utensils"></i>View menu</a>
      <a href="menu.html"><i class="fas fa-camera"></i>Scan dish</a>
      <a href="feedback.html"><i class="fas fa-comment-medical"></i>Give feedback</a>
    </section>
  </main>
</div>
<script src="app.js"></script>
<script>
  try {
    const n = localStorage.getItem("buffetsense_name");
    if (n) document.getElementById("hello").textContent = "Welcome back, " + n;
  } catch (e) {}
</script>
</body>
</html>
